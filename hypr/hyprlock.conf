# ── General ──────────────────────────────
general {
    hide_cursor = true
    ignore_empty_input = true
}

# ── Background ───────────────────────────
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.02
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.15
    vibrancy_darkness = 0.3
}

# ── Clock ────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(118, 241, 250, 1.0)
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# ── Date ─────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(220, 220, 230, 0.85)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

# ── Password input ───────────────────────
input-field {
    monitor =
    size = 300, 55
    position = 0, -100
    halign = center
    valign = center

    inner_color = rgba(36, 34, 34, 0.85)
    outer_color = rgba(118, 241, 250, 0.9)
    font_color = rgba(240, 240, 245, 1.0)
    check_color = rgba(118, 241, 250, 1.0)
    fail_color = rgba(255, 90, 90, 1.0)

    outline_thickness = 2
    rounding = 12

    placeholder_text = <i>Enter password...</i>
    fail_text = <i>Authentication failed</i>

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    shadow_passes = 2
    shadow_size = 4
}
